<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tradeflow posters</title>
<style>
  @font-face { font-family: Tf; src: url("../pdf/fonts/Archivo-400.ttf") format("truetype"); font-weight: 400; }
  @font-face { font-family: Tf; src: url("../pdf/fonts/Archivo-600.ttf") format("truetype"); font-weight: 600; }
  @font-face { font-family: Tf; src: url("../pdf/fonts/Archivo-700.ttf") format("truetype"); font-weight: 700; }
  @font-face { font-family: Tf; src: url("../pdf/fonts/Archivo-800.ttf") format("truetype"); font-weight: 800; }
  @font-face { font-family: TfWide; src: url("../pdf/fonts/Archivo-800-wide.ttf") format("truetype"); font-weight: 800; }
  :root { --ink: #14202b; --line: #2a3a48; --soft: #c9d3dc; --muted: #8a98a5; --crane: #f2b705; --paper: #f2f4f6; --cardline: #d9dfe5; --text: #14202b; --text2: #6b7a88; --good: #1e7a4c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--ink); }
  body { font-family: Tf, Arial, sans-serif; color: #fff; }
  .poster { width: 1080px; height: 1350px; position: relative; overflow: hidden; background: var(--ink); padding: 64px 72px; }
  .route { position: absolute; inset: 0; pointer-events: none; }
  .mark { position: relative; display: flex; align-items: center; gap: 14px; font-family: TfWide, Tf, sans-serif; font-weight: 800; font-size: 28px; }
  h1 { position: relative; font-family: TfWide, Tf, sans-serif; font-weight: 800; font-size: 100px; line-height: 0.98; letter-spacing: -2.6px; margin: 70px 0 0; max-width: 900px; }
  .lede { position: relative; font-size: 27px; line-height: 1.42; color: var(--soft); margin: 30px 0 0; max-width: 820px; }
  .stage { position: absolute; left: 0; right: 0; top: 600px; height: 520px; }
  .shot { position: absolute; left: 470px; top: 0; width: 780px; border-radius: 12px; border: 1px solid var(--line); box-shadow: 0 30px 70px rgba(0, 0, 0, .5); }
  .loan { position: absolute; left: 72px; top: 70px; width: 520px; zoom: 1.14; background: #fff; color: var(--text); border-radius: 16px; padding: 26px 28px 24px; box-shadow: 0 34px 80px rgba(0, 0, 0, .55); }
  .loan .top { display: flex; justify-content: space-between; align-items: center; font-size: 16px; color: var(--text2); }
  .pill { font-size: 14px; font-weight: 700; color: var(--good); background: #e3f3ea; border-radius: 999px; padding: 4px 12px; }
  .loan .title { display: flex; gap: 14px; margin-top: 16px; align-items: flex-start; }
  .grade { flex: none; width: 34px; height: 34px; border-radius: 7px; background: var(--text); color: #fff; font-weight: 800; font-size: 19px; display: flex; align-items: center; justify-content: center; margin-top: 2px; }
  .loan h3 { margin: 0; font-size: 25px; line-height: 1.2; font-weight: 800; font-family: TfWide, Tf, sans-serif; letter-spacing: -0.3px; }
  .loan .biz { font-size: 16px; color: var(--text2); margin-top: 6px; }
  .lane { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 24px; }
  .lane b { display: block; font-size: 20px; font-weight: 800; }
  .lane span { font-size: 14px; color: var(--text2); }
  .track { position: relative; height: 18px; margin: 10px 0 6px; }
  .track::before { content: ""; position: absolute; left: 6px; width: 36%; top: 8px; border-top: 2px solid var(--crane); }
  .track::after { content: ""; position: absolute; left: 36%; right: 6px; top: 8px; border-top: 2px dashed #b9c3cc; }
  .track i { position: absolute; top: 2px; width: 14px; height: 14px; border-radius: 50%; }
  .track .a { left: 0; background: var(--crane); }
  .track .b { right: 0; background: #fff; border: 2.5px solid var(--text); }
  .raised { display: flex; justify-content: space-between; font-size: 14px; color: var(--text2); }
  .nums { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--cardline); }
  .nums span { display: block; font-size: 14px; color: var(--text2); }
  .nums b { font-size: 26px; font-weight: 800; }
  .partner { position: absolute; left: 72px; right: 72px; bottom: 60px; border-top: 1px solid var(--line); padding-top: 26px; display: flex; justify-content: space-between; align-items: flex-end; gap: 40px; }
  .partner p { margin: 0; font-size: 21px; line-height: 1.4; color: var(--soft); max-width: 640px; }
  .partner p b { color: #fff; font-weight: 700; }
  .partner .url { font-size: 17px; color: var(--muted); white-space: nowrap; }
</style>
</head>
<body>
<template id="poster">
  <section class="poster">
    <svg class="route" viewBox="0 0 1080 1350" aria-hidden="true">
      <path d="M -40 1180 C 260 980, 620 1060, 1130 660" fill="none" stroke="#f2b705" stroke-opacity=".42" stroke-width="3" stroke-dasharray="10 12"/>
    </svg>
    <div class="mark"><svg width="40" height="26" viewBox="0 0 34 22"><circle cx="5" cy="11" r="5" fill="#f2b705"/><circle cx="29" cy="11" r="4" fill="none" stroke="#fff" stroke-width="2.5"/><path d="M12 11h11" stroke="#fff" stroke-width="2.5" stroke-dasharray="3 3"/></svg>Tradeflow</div>
    <h1>Get paid the day your goods ship.</h1>
    <p class="lede">Turn a confirmed invoice into cash today. Investors fund it from a bank account or USDC and are repaid when your buyer pays.</p>
    <div class="stage">
      <img class="shot" src="../pdf/portfolio.png">
      <div class="loan">
        <div class="top"><span>Invoice advance</span><span class="pill" style="color:#8a5a00;background:#fdf1cc">Raising</span></div>
        <div class="title"><div class="grade">A</div><div><h3>250 bags of green coffee, Huila washed</h3><div class="biz">Sierra Verde Coffee Exporters</div></div></div>
        <div class="lane"><div><b>CO</b><span>Colombia</span></div><div style="text-align:right"><b>DE</b><span>Germany</span></div></div>
        <div class="track"><i class="a" style="left:36%"></i><i class="b"></i></div>
        <div class="raised"><span>$3,357 raised</span><span>36% funded</span></div>
        <div class="nums"><div><span>APR</span><b>9%</b></div><div><span>Term</span><b>60 days</b></div><div><span>Advance</span><b>$9,382</b></div></div>
      </div>
    </div>
    <div class="partner"><p class="slot"></p><span class="url">github.com/Maadhav/tradeflow</span></div>
  </section>
</template>
<div id="out"></div>
<script>
  const lines = [
    '<b>Built at TOKEN2049 Origins.</b> Running end to end on Ethereum Sepolia, every loan an ERC-3643 token.',
    '<b>Powered by Chainlink CRE.</b> Every loan decision is a CRE workflow, with the credit review kept private in a TEE.',
    '<b>Runs on NOWNodes.</b> Every Chainlink CRE workflow behind each loan reads and writes the chain through NOWNodes.',
  ];
  const tpl = document.getElementById('poster');
  for (const line of lines) {
    const node = tpl.content.cloneNode(true);
    node.querySelector('.slot').innerHTML = line;
    document.getElementById('out').appendChild(node);
  }
</script>
</body>
</html>
